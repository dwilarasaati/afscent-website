<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Produk - AromaLux</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="sticky top-0 z-50 glass-card border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-purple-600 flex items-center justify-center shadow-lg shadow-purple-900/30">
                    <i class="fa-solid font-bold text-slate-900 text-xl fa-spray-can-sparkles"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wider uppercase gold-gradient-text">AFSCENT SANGATTA</h1>
                    <p class="text-xs text-slate-400">Parfum Lokal & Timteng Original</p>
                </div>
            </a>
            <a href="index.html" class="text-sm font-semibold text-slate-400 hover:text-white transition-colors flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> Kembali ke Katalog
            </a>
        </div>
    </header>

    <!-- Main Content Detail -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div id="detail-container" class="grid grid-cols-1 lg:grid-cols-2 gap-10">
            <!-- Content Injected via detail.js -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="mt-auto border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>© 2026 Velvet & Scents Perfumery. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
    <script src="detail.js"></script>
</body>
</html>
